name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: capturedex
          POSTGRES_USER: capturedex
          POSTGRES_PASSWORD: capturedex
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U capturedex -d capturedex"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://capturedex:capturedex@localhost:5432/capturedex
      DJANGO_SECRET_KEY: test-secret
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - working-directory: backend
        run: pip install -r requirements.txt

      - working-directory: backend
        run: python manage.py migrate --noinput

      - working-directory: backend
        run: python manage.py test

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - working-directory: frontend
        run: npm install -g npm@11.6.2

      - working-directory: frontend
        run: npm ci

      - working-directory: frontend
        run: npm run lint

      - working-directory: frontend
        run: npm run build