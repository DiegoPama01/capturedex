services:
  backend:
    build:
      context: ./backend
    container_name: capturedex-backend
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "8000:8000"

    networks:
      - infra

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    container_name: capturedex-frontend
    restart: unless-stopped

    env_file:
      - .env

    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}

    ports:
      - "3000:3000"

    networks:
      - infra

networks:
  infra:
    external: true
